# Sleek dark mode with violet and cyan accents.
name: modern-dark
description: Sleek dark mode with accent colors
mode: dark

background: "#0f172a"   # page background
surface: "#1e293b"      # cards, panels, inputs
text: "#e2e8f0"         # body text
muted: "#94a3b8"        # secondary text
border: "#334155"

# Accent colours, most important first. The original site's most used
# brand colour becomes the first one, the next becomes the second, and so on.
palette:
  - "#8b5cf6"
  - "#22d3ee"
  - "#f472b6"
  - "#facc15"

fonts:
  body: "Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
  heading: "'Space Grotesk', Inter, 'Segoe UI', system-ui, sans-serif"
  mono: "'JetBrains Mono', Consolas, monospace"
  # Optional web font stylesheet; the stacks above fall back to system fonts
  # when offline.
  import: "https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap"

radius: 12px            # corner rounding for buttons, cards and inputs

# Layout personality: bold, card-based, floating header.
layout:
  max_width: 1240px       # centre page content at this width
  spacing: 1.25           # multiplies padding and gaps (1 = normal)
  heading_scale: 1.35     # how much bigger headings get
  heading_weight: 800
  header: sticky          # sticky (stays on screen while scrolling) or static
  cards: elevated         # elevated (shadow + lift on hover), outlined or flat
  card_min_width: 200px   # item grids get as many columns as fit at this width
  image_radius: 14px
  buttons: pill           # pill, rounded or square
  nav_style: caps         # caps (small uppercase links) or underline
